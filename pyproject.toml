[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voting"
version = "0.1.0"
description = "JSON-first CLI for voting scenarios"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1,<9",
  "rich",
  "typer>=0.12,<1",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest"]
humanize = [
  "edsl @ git+https://github.com/expectedparrot/edsl.git@3b5f281057f24b2cbdbe1ea1db9b05b989128d38"
]

[project.scripts]
voting = "voting.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["voting", "voting.*"]

[tool.setuptools.package-data]
voting = ["docs_content/*.md", "manual_content/*.tex", "manual_content/*.md"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
